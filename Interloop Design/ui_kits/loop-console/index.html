<!-- @dsCard group="Loop Console" viewport="1320x900" name="Loop Console — operations dashboard" subtitle="Interloop-branded admin UI · login → dashboard → orders → people" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop Console — Interloop</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="lc.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.456.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>

<script src="data.js"></script>
<script type="text/babel" src="Topbar.jsx"></script>
<script type="text/babel" src="LoginScreen.jsx"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="OrdersScreen.jsx"></script>
<script type="text/babel" src="PeopleScreen.jsx"></script>

<script type="text/babel" data-presets="react">
  const NAV = [
    { items: [
      { key: 'dashboard', label: 'Dashboard', icon: <i data-lucide="layout-dashboard"></i> },
      { key: 'orders', label: 'Orders', icon: <i data-lucide="package"></i>, badge: 8 },
    ]},
    { title: 'Operations', items: [
      { key: 'production', label: 'Production', icon: <i data-lucide="factory"></i> },
      { key: 'traceability', label: 'Traceability', icon: <i data-lucide="route"></i> },
      { key: 'people', label: 'People', icon: <i data-lucide="users"></i> },
    ]},
    { title: 'Insights', items: [
      { key: 'sustainability', label: 'Sustainability', icon: <i data-lucide="leaf"></i> },
      { key: 'reports', label: 'Reports', icon: <i data-lucide="bar-chart-3"></i> },
    ]},
  ];

  const TITLES = { dashboard: 'Dashboard', orders: 'Orders', people: 'People' };

  function App() {
    const { SidebarNav, Avatar } = window.ILPDesignSystem_7d03df;
    const [signedIn, setSignedIn] = React.useState(false);
    const [view, setView] = React.useState('dashboard');

    React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

    if (!signedIn) {
      return <window.LoginScreen onSignIn={() => setSignedIn(true)} />;
    }

    let Screen;
    if (view === 'orders') Screen = <window.OrdersScreen />;
    else if (view === 'people') Screen = <window.PeopleScreen />;
    else if (view === 'dashboard') Screen = <window.DashboardScreen onOpenOrders={() => setView('orders')} />;
    else Screen = <window.DashboardScreen onOpenOrders={() => setView('orders')} />;

    const U = window.LC_DATA.user;

    return (
      <div className="lc-app">
        <SidebarNav
          activeKey={view}
          onSelect={setView}
          sections={NAV}
          footer={
            <div className="ilp-sidebar__user">
              <Avatar name={U.name} size={36} status="online" />
              <div className="ilp-sidebar__user-meta">
                <div className="ilp-sidebar__user-name">{U.name}</div>
                <div className="ilp-sidebar__user-mail">{U.email}</div>
              </div>
            </div>
          }
        />
        <div className="lc-main">
          <window.Topbar title={TITLES[view] || 'Loop Console'} />
          <div className="lc-content">{Screen}</div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  setTimeout(() => window.lucide && window.lucide.createIcons(), 80);
</script>
</body>
</html>
