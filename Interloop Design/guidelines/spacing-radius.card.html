<!-- @dsCard group="Spacing" viewport="700x160" name="Corner radii" subtitle="4px → 24px and pill" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); display:flex; gap: 18px; align-items:flex-end; }
  .item { text-align: center; }
  .box { width: 76px; height: 60px; background: var(--il-blue-100); border: 1.5px solid var(--il-blue-400); }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); margin-top: 8px; }
  .lab b { display:block; font-family: var(--font-sans); color: var(--text-primary); font-weight: var(--weight-semibold); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lab"><b>sm</b>6px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lab"><b>md</b>8px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lab"><b>lg</b>12px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lab"><b>xl</b>16px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="lab"><b>2xl</b>24px</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-pill);width:60px"></div><div class="lab"><b>pill</b>999px</div></div>
</body>
</html>
