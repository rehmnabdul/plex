<!-- @dsCard group="Spacing" viewport="700x190" name="Elevation" subtitle="Soft, cool-tinted shadows (xs → xl) + brand glow" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px 24px; background: var(--surface-page); display:flex; gap: 20px; align-items:center; }
  .item { text-align: center; }
  .box { width: 88px; height: 64px; background: var(--surface-card); border-radius: var(--radius-lg); }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); margin-top: 12px; }
</style>
</head>
<body>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="lab">xs</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lab">sm</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lab">md</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lab">lg</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="lab">xl</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-brand)"></div><div class="lab">brand</div></div>
</body>
</html>
